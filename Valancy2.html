<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>संयोजकता क्विज़</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg1: #1a1a2e;
    --bg2: #16213e;
    --accent1: #6c5ce7;
    --accent2: #a29bfe;
    --green: #00b894;
    --green-light: #d4f8e8;
    --red: #e74c3c;
    --red-light: #ffe0dc;
    --card: #ffffff;
    --text: #2d3436;
    --muted: #636e72;
  }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 50%, #0f3460 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 28px;
    padding: 22px 18px 28px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
    animation: slideUp 0.5s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .app::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(108,92,231,0.15), transparent 70%);
    border-radius: 50%;
  }

  /* ---- Header ---- */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 4px 12px rgba(108,92,231,0.4);
  }

  .logo-text {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
  }

  .score-badge {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(108,92,231,0.35);
  }

  /* ---- Progress ---- */
  .progress-wrap {
    margin: 14px 0 4px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }

  .progress-track {
    height: 9px;
    background: #eef0f5;
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2), #fd79a8);
    background-size: 200% 100%;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
    animation: shimmer 2.5s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  /* ---- Question ---- */
  .question-card {
    background: linear-gradient(135deg, #f8f9ff, #f0f2ff);
    border-radius: 18px;
    padding: 18px 16px;
    margin: 16px 0;
    border: 1px solid #e8eaff;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }

  .q-number {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.55;
  }

  /* ---- Options ---- */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: #fafbff;
    border: 2px solid #e8eaff;
    border-radius: 14px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
    transition: all 0.2s ease;
    position: relative;
  }

  .option:active:not(.locked) {
    transform: scale(0.98);
  }

  .option-letter {
    min-width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: #e8eaff;
    color: var(--accent1);
    border-radius: 9px;
    font-weight: 700;
    font-size: 0.85rem;
    transition: all 0.2s;
  }

  /* Hover (desktop) */
  @media (hover: hover) {
    .option:hover:not(.locked) {
      border-color: var(--accent2);
      background: #f4f2ff;
      transform: translateX(4px);
    }
  }

  /* Correct */
  .option.correct {
    background: var(--green-light);
    border-color: var(--green);
    animation: pop 0.35s ease;
  }
  .option.correct .option-letter {
    background: var(--green);
    color: #fff;
  }

  /* Wrong */
  .option.wrong {
    background: var(--red-light);
    border-color: var(--red);
    animation: shake 0.4s ease;
  }
  .option.wrong .option-letter {
    background: var(--red);
    color: #fff;
  }

  .option.locked { cursor: default; }

  .option .mark {
    margin-left: auto;
    font-size: 1.2rem;
    font-weight: 800;
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* ---- Solution ---- */
  .solution {
    margin-top: 14px;
    padding: 14px 16px;
    background: #f4f2ff;
    border-radius: 14px;
    border-left: 4px solid var(--accent1);
    font-size: 0.9rem;
    color: #4a4a6a;
    line-height: 1.6;
    display: none;
  }

  .solution.show {
    display: block;
    animation: fadeIn 0.3s ease;
  }

  .solution .sol-title {
    font-weight: 700;
    color: var(--accent1);
    display: block;
    margin-bottom: 4px;
    font-size: 0.85rem;
  }

  /* ---- Next Button ---- */
  .btn-next {
    display: none;
    width: 100%;
    margin-top: 16px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(108,92,231,0.4);
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .btn-next.show { display: block; animation: fadeIn 0.3s ease; }

  .btn-next:active { transform: scale(0.97); box-shadow: 0 4px 10px rgba(108,92,231,0.4); }

  /* ---- Result Screen ---- */
  .result-screen {
    display: none;
    text-align: center;
    padding: 10px 0;
    animation: fadeIn 0.5s ease;
  }

  .result-screen.show { display: block; }

  .trophy {
    font-size: 64px;
    margin-bottom: 8px;
    animation: bounce 1.2s ease infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .result-title {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 4px;
  }

  .result-sub {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .score-ring {
    width: 160px; height: 160px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: conic-gradient(var(--accent1) 0deg, var(--accent2) 0deg, #e8eaff 0deg);
    position: relative;
    transition: background 1s ease;
  }

  .score-ring::after {
    content: '';
    position: absolute;
    width: 128px; height: 128px;
    background: #fff;
    border-radius: 50%;
  }

  .score-ring-inner {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .score-num {
    font-size: 2.6rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .score-total {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
    margin-top: 2px;
  }

  .result-msg {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    padding: 14px;
    background: #f4f2ff;
    border-radius: 14px;
    margin-bottom: 20px;
  }

  .btn-restart {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(108,92,231,0.4);
    transition: all 0.2s;
  }

  .btn-restart:active { transform: scale(0.97); }

  /* ---- Mobile tweaks ---- */
  @media (max-width: 380px) {
    .app { padding: 18px 14px 22px; border-radius: 22px; }
    .question-text { font-size: 0.98rem; }
    .option { font-size: 0.9rem; padding: 12px 14px; }
    .score-ring { width: 140px; height: 140px; }
    .score-ring::after { width: 112px; height: 112px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Quiz screen -->
  <div id="quizScreen">
    <div class="top-bar">
      <div class="logo">
        <div class="logo-icon">⚗️</div>
        <span class="logo-text">संयोजकता क्विज़</span>
      </div>
      <div class="score-badge" id="liveScore">स्कोर: 0</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-info">
        <span id="qCounter">प्रश्न 1 / 20</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="question-card">
      <span class="q-number" id="qNumber">प्रश्न 1</span>
      <div class="question-text" id="questionText"></div>
    </div>

    <div class="options" id="options"></div>

    <div class="solution" id="solution"></div>

    <button class="btn-next" id="nextBtn">अगला प्रश्न →</button>
  </div>

  <!-- Result screen -->
  <div class="result-screen" id="resultScreen">
    <div class="trophy" id="trophy">🏆</div>
    <div class="result-title">क्विज़ पूरी हुई!</div>
    <div class="result-sub">आपका प्रदर्शन</div>

    <div class="score-ring" id="scoreRing">
      <div class="score-ring-inner">
        <span class="score-num" id="scoreNum">0</span>
        <span class="score-total" id="scoreTotal">/ 20</span>
      </div>
    </div>

    <div class="result-msg" id="resultMsg"></div>

    <button class="btn-restart" onclick="location.reload()">🔄 फिर से खेलें</button>
  </div>
</div>

<script>
const quizData = [
  { q: "CO₂ में कार्बन की संयोजकता कितनी है?", options: ["2", "3", "4", "6"], correct: 2, solution: "CO₂ = O=C=O, कार्बन 2 द्वि-बंध बनाता है → 2×2 = 4" },
  { q: "N₂O में नाइट्रोजन की संयोजकता कितनी है?", options: ["1", "2", "3", "4"], correct: 0, solution: "सूत्र से: 2×N = 1×2 → N = 1 (औसत संयोजकता)" },
  { q: "NH₃ में नाइट्रोजन की संयोजकता है:", options: ["1", "2", "3", "5"], correct: 2, solution: "N 3 हाइड्रोजन से 3 एकल बंध बनाता है → संयोजकता 3" },
  { q: "HNO₃ में नाइट्रोजन की संयोजकता है:", options: ["3", "4", "5", "2"], correct: 2, solution: "1 + x + 3(−2) = 0 → x = +5; संरचना में 1 एकल + 2 द्वि-बंध = 5" },
  { q: "किस तत्व की संयोजकता सदैव 4 रहती है?", options: ["नाइट्रोजन", "कार्बन", "ऑक्सीजन", "सल्फर"], correct: 1, solution: "कार्बन हमेशा 4 बंध बनाता है (CO₂, CH₄, CCl₄ सभी में 4)" },
  { q: "CH₄ में कार्बन की संयोजकता है:", options: ["2", "3", "4", "1"], correct: 2, solution: "कार्बन 4 हाइड्रोजन से 4 एकल बंध बनाता है → 4" },
  { q: "NO में नाइट्रोजन की संयोजकता है:", options: ["1", "2", "3", "4"], correct: 1, solution: "N=O द्वि-बंध → नाइट्रोजन 2 इलेक्ट्रॉन साझा करता है → 2" },
  { q: "NO₂ में नाइट्रोजन की संयोजकता है:", options: ["2", "3", "4", "5"], correct: 2, solution: "एक द्वि-बंध (2) + एक एकल बंध (1) + उपसहसंयोजक बंध (1) = 4" },
  { q: "Fe की सामान्य संयोजकताएँ हैं:", options: ["1 और 2", "2 और 3", "3 और 4", "1 और 3"], correct: 1, solution: "Fe²⁺ (फेरस) और Fe³⁺ (फेरिक) — d-कक्षक इलेक्ट्रॉन भाग लेते हैं" },
  { q: "Cu की सामान्य संयोजकताएँ हैं:", options: ["1 और 2", "2 और 3", "1 और 3", "2 और 4"], correct: 0, solution: "Cu⁺ (क्यूप्रस) और Cu²⁺ (क्यूप्रिक)" },
  { q: "सल्फर की संभावित संयोजकताएँ हैं:", options: ["1, 2, 3", "2, 4, 6", "1, 3, 5", "2, 3, 4"], correct: 1, solution: "H₂S (2), SO₂ (4), SO₃/H₂SO₄ (6) — खाली d-कक्षक के कारण" },
  { q: "N₂O में ऑक्सीजन की संयोजकता है:", options: ["1", "2", "3", "4"], correct: 1, solution: "ऑक्सीजन की संयोजकता लगभग हमेशा 2 होती है" },
  { q: "संक्रमण धातुओं में चर संयोजकता का कारण है:", options: ["s-कक्षक", "p-कक्षक", "d-कक्षक", "f-कक्षक"], correct: 2, solution: "आंतरिक अधूरे d-कक्षक के इलेक्ट्रॉन भी बंधन में भाग लेते हैं" },
  { q: "निम्न में किसकी संयोजकता स्थिर रहती है?", options: ["Fe", "Cu", "कार्बन", "Sn"], correct: 2, solution: "कार्बन की संयोजकता हमेशा 4; Fe, Cu, Sn चर संयोजकता दर्शाते हैं" },
  { q: "\"संयोजकता तत्व की विशेषता है, यौगिक की नहीं\" — यह किसके लिए सर्वाधिक सत्य है?", options: ["नाइट्रोजन", "कार्बन", "लोहा", "तांबा"], correct: 1, solution: "कार्बन हर यौगिक में 4 ही रहता है, यौगिक बदलने पर नहीं बदलता" },
  { q: "PCl₅ में फॉस्फोरस की संयोजकता है:", options: ["3", "4", "5", "6"], correct: 2, solution: "P 5 क्लोरीन से 5 एकल बंध बनाता है → 5" },
  { q: "SO₂ में सल्फर की संयोजकता है:", options: ["2", "4", "6", "3"], correct: 1, solution: "S एक O से द्वि-बंध + दूसरे O से द्वि-बंध (या 1 द्वि + 2 एकल) = 4" },
  { q: "CO₂ की संरचना में कार्बन कितने बंध बनाता है?", options: ["2", "3", "4", "6"], correct: 2, solution: "O=C=O → 2 द्वि-बंध × 2 = 4 बंध" },
  { q: "निम्न में किस तत्व की संयोजकता 1 से 5 तक बदल सकती है?", options: ["कार्बन", "ऑक्सीजन", "नाइट्रोजन", "हाइड्रोजन"], correct: 2, solution: "N₂O(1), NO(2), NH₃(3), NO₂(4), HNO₃(5)" },
  { q: "N₂O की संरचना में पहले नाइट्रोजन की संयोजकता है:", options: ["1", "2", "3", "4"], correct: 2, solution: "संरचना N≡N⁺—O⁻ में पहला N त्रि-बंध बनाता है → 3" }
];

let current = 0;
let score = 0;
let answered = false;

const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');
const questionText = document.getElementById('questionText');
const optionsEl = document.getElementById('options');
const solutionEl = document.getElementById('solution');
const nextBtn = document.getElementById('nextBtn');
const qCounter = document.getElementById('qCounter');
const qNumber = document.getElementById('qNumber');
const progressFill = document.getElementById('progressFill');
const progressPct = document.getElementById('progressPct');
const liveScore = document.getElementById('liveScore');

function loadQuestion() {
  answered = false;
  const q = quizData[current];

  // Progress
  const pct = Math.round((current / quizData.length) * 100);
  progressFill.style.width = pct + '%';
  progressPct.textContent = pct + '%';
  qCounter.textContent = `प्रश्न ${current + 1} / ${quizData.length}`;
  qNumber.textContent = `प्रश्न ${current + 1}`;
  liveScore.textContent = `स्कोर: ${score}`;

  // Question
  questionText.textContent = q.q;

  // Options
  optionsEl.innerHTML = '';
  solutionEl.classList.remove('show');
  solutionEl.innerHTML = '';
  nextBtn.classList.remove('show');

  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + idx)}</span><span>${opt}</span>`;
    div.onclick = () => selectOption(idx, div);
    optionsEl.appendChild(div);
  });
}

function selectOption(selected, div) {
  if (answered) return;
  answered = true;

  const q = quizData[current];
  const allOptions = optionsEl.querySelectorAll('.option');

  allOptions.forEach((optDiv, idx) => {
    optDiv.classList.add('locked');
    if (idx === q.correct) {
      optDiv.classList.add('correct');
      optDiv.innerHTML += `<span class="mark">✓</span>`;
    }
    if (idx === selected && idx !== q.correct) {
      optDiv.classList.add('wrong');
      optDiv.innerHTML += `<span class="mark">✗</span>`;
    }
  });

  if (selected === q.correct) {
    score++;
    liveScore.textContent = `स्कोर: ${score}`;
  }

  // Solution
  solutionEl.innerHTML = `<span class="sol-title">📘 समाधान</span>सही उत्तर: <b>${q.options[q.correct]}</b><br>${q.solution}`;
  solutionEl.classList.add('show');

  nextBtn.textContent = (current === quizData.length - 1) ? 'परिणाम देखें 🎯' : 'अगला प्रश्न →';
  nextBtn.classList.add('show');
}

nextBtn.onclick = () => {
  current++;
  if (current < quizData.length) {
    loadQuestion();
  } else {
    showResult();
  }
};

function showResult() {
  quizScreen.style.display = 'none';
  resultScreen.classList.add('show');

  const pct = (score / quizData.length) * 100;
  const deg = (pct / 100) * 360;

  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreTotal').textContent = `/ ${quizData.length}`;

  // Animate ring
  const ring = document.getElementById('scoreRing');
  let curDeg = 0;
  const interval = setInterval(() => {
    curDeg += 6;
    if (curDeg >= deg) { curDeg = deg; clearInterval(interval); }
    ring.style.background = `conic-gradient(#6c5ce7 0deg, #a29bfe ${curDeg}deg, #e8eaff ${curDeg}deg)`;
  }, 15);

  // Message
  let msg, trophy;
  if (pct === 100) { msg = '🏆 शानदार! आपने सभी सही किए!'; trophy = '🏆'; }
  else if (pct >= 80) { msg = '🌟 बहुत बढ़िया! लगभग सब सही!'; trophy = '🥇'; }
  else if (pct >= 60) { msg = '👍 अच्छा प्रयास! थोड़ा और अभ्यास करें।'; trophy = '🥈'; }
  else if (pct >= 40) { msg = '📖 ठीक है, रिवीजन जरूरी है।'; trophy = '📚'; }
  else { msg = '💪 चिंता न करें, दोबारा अभ्यास करें!'; trophy = '💪'; }

  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('trophy').textContent = trophy;
}

loadQuestion();
</script>

</html>
